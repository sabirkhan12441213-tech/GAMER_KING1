<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // यह कोड ऐप द्वारा भेजे गए पूरे रास्ते को पकड़कर की निकालेगा (GAMER- से शुरू होने वाली)
        const fullPath = window.location.pathname; 
        const segments = fullPath.split('/');
        const token = segments[segments.length - 1]; 

        if (token && token.startsWith('GAMER-')) {
            window.location.href = './index.html?key=' + token;
        } else {
            window.location.href = './index.html';
        }
    </script>
</head>
<body style="background: #050505; color: #fff; text-align: center; padding-top: 100px; font-family: Arial;">
    <h3>Key Load ho rahi hai... Ruko!</h3>
</body>
</html>

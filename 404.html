<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // यह कोड ऐप द्वारा भेजे गए पूरे रास्ते (पाथ) को पकड़ लेगा जिसमें की छिपी है
        const fullPath = window.location.pathname; // जैसे /GAMER_KING1/DP-0C7A28
        const segments = fullPath.split('/');
        const token = segments[segments.length - 1]; // आखिरी हिस्सा निकालेगा (जैसे DP-0C7A28)

        if (token && token.startsWith('DP-')) {
            // अगर की मिल गई, तो उसे index.html को पास कर देगा
            window.location.href = './index.html?key=' + token;
        } else {
            window.location.href = './index.html';
        }
    </script>
</head>
<body style="background: #050505; color: #fff; text-align: center; padding-top: 100px; font-family: Arial;">
    <h3>Key Load ho rahi hai... Ruko!</h3>
</body>
</html>

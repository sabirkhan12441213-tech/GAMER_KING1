<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMER Key Verification</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }
        .container {
            max-width: 380px;
            margin: auto;
            background: #1a0020;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #9D46FF;
            box-shadow: 0 0 15px rgba(157, 70, 255, 0.3);
        }
        h2 {
            color: #9D46FF;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.5;
        }
        #keyDisplay {
            margin-top: 20px;
            font-size: 18px;
            color: #00ffcc;
            font-weight: bold;
            word-break: break-all;
            background: #0a000f;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed #00ffcc;
            display: none;
        }
        .copied-msg {
            font-size: 13px;
            color: #00ff88;
            margin-top: 15px;
            font-weight: bold;
        }
        .error-box {
            color: #ff4444;
            font-size: 15px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GAMER Verification</h2>
        <p id="instructionText">की की जाँच की जा रही है...</p>
        
        <div id="keyDisplay"></div>
        <div id="msg" class="copied-msg"></div>
        <div id="errorMsg" class="error-box"></div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // ऐप जितने भी तरीके से की भेज सकता है, उन सबको यहाँ चेक कर रहे हैं
            let appKey = urlParams.get('text') || urlParams.get('key') || urlParams.get('url') || urlParams.get('q');
            
            // अगर पैरामीटर में नहीं मिला, तो पूरे URL में से 'DP-' ढूंढ लो
            if (!appKey) {
                const fullUrl = window.location.href;
                const match = fullUrl.match(/DP-[a-zA-Z0-9_-]+/);
                if (match) {
                    appKey = match[0];
                }
            }

            const keyBox = document.getElementById("keyDisplay");
            const msgBox = document.getElementById("msg");
            const errorBox = document.getElementById("errorMsg");
            const instText = document.getElementById("instructionText");

            if (appKey && appKey.startsWith("DP-")) {
                instText.innerHTML = "यह रही आपकी की (Key):";
                errorBox.style.display = "none";
                keyBox.style.display = "block";
                keyBox.innerText = appKey;
                
                // Google Translate की तरह तुरंत कॉपी कर देगा
                navigator.clipboard.writeText(appKey).then(() => {
                    msgBox.innerText = "✓ Key Copied Successfully!";
                }).catch(err => {
                    msgBox.innerText = "की मिल गई है, इसे कॉपी कर लें।";
                });
            } else {
                instText.style.display = "none";
                errorBox.innerText = "❌ कोई की नहीं मिली!\nकृपया ऐप के अंदर से 'Get Key' दबाकर आएं।";
            }
        };
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMER Key Generator</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }
        .container {
            max-width: 380px;
            margin: auto;
            background: #1a0020;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #9D46FF;
            box-shadow: 0 0 15px rgba(157, 70, 255, 0.3);
        }
        h2 {
            color: #9D46FF;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #cccccc;
        }
        #keyDisplay {
            margin-top: 20px;
            font-size: 20px;
            color: #00ffcc;
            font-weight: bold;
            word-break: break-all;
            background: #0a000f;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed #00ffcc;
        }
        .copied-msg {
            font-size: 13px;
            color: #00ff88;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GAMER Verification</h2>
        <p>آپ کی ایپ کی اصل Key नीचे आ चुकी है:</p>
        
        <!-- यहाँ ऐप द्वारा भेजी गई असली की दिखेगी -->
        <div id="keyDisplay">Key Load ho rahi hai...</div>
        <div id="msg" class="copied-msg"></div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const appKey = urlParams.get('key');
            
            const keyBox = document.getElementById("keyDisplay");
            const msgBox = document.getElementById("msg");

            if (appKey && appKey.startsWith('GAMER-')) {
                // ऐप ने जो की भेजी है, बिल्कुल वही यहाँ दिखाएगा
                keyBox.innerText = appKey;
                
                // ऑटोमैटिक कॉपी कर लेगा
                navigator.clipboard.writeText(appKey);
                msgBox.innerText = "✓ Key Copied to Clipboard! अब ऐप में जाकर पेस्ट करें।";
            } else {
                keyBox.innerText = "Error: App se Get Key dabao!";
                msgBox.innerText = "कृपया ऐप के अंदर से 'Get Key' बटन पर क्लिक करें।";
            }
        };
    </script>

</body>
</html>

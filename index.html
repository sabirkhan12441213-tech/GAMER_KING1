<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMER Key Generator</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }
        .container {
            max-width: 380px;
            margin: auto;
            background: #1a0020;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #9D46FF;
            box-shadow: 0 0 15px rgba(157, 70, 255, 0.3);
        }
        h2 {
            color: #9D46FF;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #cccccc;
        }
        button {
            background-color: #6200EE;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #7c4dff;
        }
        #keyDisplay {
            margin-top: 20px;
            font-size: 18px;
            color: #00ffcc;
            font-weight: bold;
            word-break: break-all;
            background: #0a000f;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed #00ffcc;
        }
        .copied-msg {
            font-size: 13px;
            color: #00ff88;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GAMER Verification</h2>
        <p>अपनी की (Key) प्राप्त करने के लिए नीचे क्लिक करें:</p>
        
        <button onclick="generateKey()">Get New Key</button>
        
        <!-- की यहाँ दिखेगी और ऑटो-कॉपी हो जाएगी -->
        <div id="keyDisplay" style="display:none;"></div>
        <div id="msg" class="copied-msg"></div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const appKey = urlParams.get('key');
            
            const keyBox = document.getElementById("keyDisplay");
            const msgBox = document.getElementById("msg");

            // अगर ऐप ने की भेजी है, तो वही दिखाओ और कॉपी करो
            if (appKey) {
                keyBox.style.display = "block";
                keyBox.innerText = appKey;
                navigator.clipboard.writeText(appKey);
                msgBox.innerText = "✓ Key Copied to Clipboard! ऐप में पेस्ट करें।";
            } else {
                // अगर सीधे खुले, तो खुद एक फ्रेश की बना दो
                generateKey();
            }
        };

        function generateKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "DP-";
            for (let i = 0; i < 18; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            const keyBox = document.getElementById("keyDisplay");
            keyBox.style.display = "block";
            keyBox.innerText = key;
            
            navigator.clipboard.writeText(key);
            document.getElementById("msg").innerText = "✓ Key Copied to Clipboard! ऐप में पेस्ट करें।";
        }
    </script>

</body>
</html>

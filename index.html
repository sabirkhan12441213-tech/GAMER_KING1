<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMER Key Verification</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }
        .container {
            max-width: 380px;
            margin: auto;
            background: #1a0020;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #9D46FF;
            box-shadow: 0 0 15px rgba(157, 70, 255, 0.3);
        }
        h2 {
            color: #9D46FF;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.5;
        }
        #keyDisplay {
            margin-top: 20px;
            font-size: 16px;
            color: #ff5555;
            font-weight: bold;
            word-break: break-all;
            background: #0a000f;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed #ff5555;
        }
        .copied-msg {
            font-size: 13px;
            color: #00ff88;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GAMER Verification</h2>
        <p id="instructionText">कृपया पहले अपने मॉड ऐप को खोलें और वहाँ <b>'Get Key'</b> पर क्लिक करें।</p>
        
        <!-- की या एरर मैसेज यहाँ दिखेगा -->
        <div id="keyDisplay">ऐप से की का इंतज़ार है...</div>
        <div id="msg" class="copied-msg"></div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const appKey = urlParams.get('url'); // ऐप इसी पैरामीटर में की भेज रहा है
            
            const keyBox = document.getElementById("keyDisplay");
            const msgBox = document.getElementById("msg");
            const instText = document.getElementById("instructionText");

            // अगर ऐप से की आई है तभी आगे बढ़ो
            if (appKey) {
                instText.innerHTML = "आपकी की (Key) सफलतापूर्वक प्राप्त हो गई है:";
                keyBox.style.color = "#00ffcc";
                keyBox.style.borderColor = "#00ffcc";
                keyBox.innerText = appKey;
                
                // तुरंत क्लिपबोर्ड पर कॉपी करो
                navigator.clipboard.writeText(appKey).then(() => {
                    msgBox.innerText = "✓ Key Copied! अब ऐप में जाकर पेस्ट करें।";
                }).catch(err => {
                    msgBox.innerText = "की मिल गई है, इसे मैन्युअल रूप से कॉपी करें।";
                });
            } else {
                // अगर कोई सीधे ब्राउज़र में खोलेगा तो यह दिखेगा
                keyBox.innerText = "❌ कोई की नहीं मिली!";
                msgBox.innerText = "कृपया ऐप के अंदर से 'Get Key' बटन दबाकर आएं।";
            }
        };
    </script>

</body>
</html>

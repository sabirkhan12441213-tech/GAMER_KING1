<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMER Key Verification</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }
        .container {
            max-width: 380px;
            margin: auto;
            background: #1a0020;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #9D46FF;
            box-shadow: 0 0 15px rgba(157, 70, 255, 0.3);
        }
        h2 {
            color: #9D46FF;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.5;
        }
        #keyDisplay {
            margin-top: 20px;
            font-size: 16px;
            color: #00ffcc;
            font-weight: bold;
            word-break: break-all;
            background: #0a000f;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed #00ffcc;
        }
        .copied-msg {
            font-size: 13px;
            color: #00ff88;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GAMER Verification</h2>
        <p id="instructionText">की जाँची जा रही है...</p>
        
        <div id="keyDisplay">इंतज़ार करें...</div>
        <div id="msg" class="copied-msg"></div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // यह कोड सभी संभावित पैरामीटर और पूरे यूआरएल में 'DP-' को ढूँढ लेगा
            let appKey = urlParams.get('url') || urlParams.get('key') || urlParams.get('api') || urlParams.get('token');
            
            // अगर पैरामीटर में नहीं मिला, तो पूरे URL में 'DP-' ढूंढो
            if (!appKey) {
                const fullUrl = window.location.href;
                const match = fullUrl.match(/DP-[a-zA-Z0-9_-]+/);
                if (match) {
                    appKey = match[0];
                }
            }
            
            const keyBox = document.getElementById("keyDisplay");
            const msgBox = document.getElementById("msg");
            const instText = document.getElementById("instructionText");

            if (appKey && appKey.startsWith("DP-")) {
                instText.innerHTML = "आपकी की (Key) सफलतापूर्वक मिल गई है:";
                keyBox.innerText = appKey;
                
                // क्लिपबोर्ड पर ऑटो-कॉपी करें
                navigator.clipboard.writeText(appKey).then(() => {
                    msgBox.innerText = "✓ Key Copied! अब ऐप में जाकर पेस्ट करें।";
                }).catch(err => {
                    msgBox.innerText = "की मिल गई है, इसे मैन्युअल रूप से कॉपी करें।";
                });
            } else {
                instText.innerHTML = "कृपया अपने मॉड ऐप से 'Get Key' दबाकर शॉर्टनर पार करके आएं।";
                keyBox.style.color = "#ff5555";
                keyBox.style.borderColor = "#ff5555";
                keyBox.innerText = "❌ की नहीं मिली!";
                msgBox.innerText = "शॉर्टनर लिंक से होकर आना जरूरी है।";
            }
        };
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMER Key Verification</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }
        .container {
            max-width: 380px;
            margin: auto;
            background: #1a0020;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #9D46FF;
            box-shadow: 0 0 15px rgba(157, 70, 255, 0.3);
        }
        h2 {
            color: #9D46FF;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #cccccc;
        }
        #keyDisplay {
            margin-top: 20px;
            font-size: 16px;
            color: #00ffcc;
            font-weight: bold;
            word-break: break-all;
            background: #0a000f;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed #00ffcc;
        }
        .copied-msg {
            font-size: 14px;
            color: #00ff88;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GAMER Verification</h2>
        <p>आपकी की (Key) लोड हो रही है...</p>
        
        <!-- ऐप द्वारा भेजी गई की यहाँ दिखेगी -->
        <div id="keyDisplay">लोड हो रहा है...</div>
        <div id="msg" class="copied-msg"></div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const appKey = urlParams.get('url'); // ध्यान दे, ऐप 'url' पैरामीटर में की भेज रहा है
            
            const keyBox = document.getElementById("keyDisplay");
            const msgBox = document.getElementById("msg");

            if (appKey) {
                keyBox.innerText = appKey;
                // क्लिपबोर्ड पर ऑटो-कॉपी करें
                navigator.clipboard.writeText(appKey).then(() => {
                    msgBox.innerText = "✓ Key Copied to Clipboard! अब ऐप में जाकर पेस्ट करें।";
                }).catch(err => {
                    msgBox.innerText = "की कॉपी हो गई है, इसे मैन्युअल रूप से कॉपी करें।";
                });
            } else {
                keyBox.innerText = "कोई की नहीं मिली! कृपया ऐप से 'Get Key' दबाकर आएं।";
                msgBox.innerText = "";
            }
        };
    </script>

</body>
</html>
